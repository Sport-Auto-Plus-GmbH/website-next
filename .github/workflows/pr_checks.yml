name: PR Checks

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  description:
    name: PR has a description
    runs-on: ubuntu-latest
    steps:
      - name: Check PR description is not empty
        uses: actions/github-script@v7
        with:
          script: |
            const body = (context.payload.pull_request.body || '')
              .replace(/<!--[\s\S]*?-->/g, '')
              .trim()
            if (body.length < 20) {
              core.setFailed(
                'This pull request needs a description — fill in the PR template (what changed and why).',
              )
            }
