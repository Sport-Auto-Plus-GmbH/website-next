name: Release Website
on:
  workflow_dispatch:
    inputs:
      env:
        type: choice
        default: 'dev'
        description: 'Environment to deploy to'
        options:
          - dev
          - staging
          - prod

permissions:
  contents: read
  id-token: write

jobs:
  deploy-release:
    uses: ./.github/workflows/c_build_and_deploy.yml
    secrets: inherit
    with:
      environment: ${{ inputs.env }}
      image_version: ${{ github.sha }}
    if: github.event_name == 'workflow_dispatch'
